<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dota 2 Meta Tracker</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #080b0e; --bg-card: #11161d; --bg-card-hover: #18202a;
            --primary-dota: #ff1e27; --accent-gold: #ffb020; --text-white: #ffffff; --text-gray: #94a3b8;
            --tier-s: #ff3838; --tier-a: #ff9f1a; --tier-b: #05c46b;
            --glow-shadow: 0 0 20px rgba(255, 30, 39, 0.3);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; cursor: none !important; }
        body {
            font-family: 'Rajdhani', sans-serif; background-color: var(--bg-dark); color: var(--text-white);
            overflow-x: hidden; min-height: 100vh; position: relative;
        }
        #custom-cursor {
            position: fixed; width: 8px; height: 8px; background: var(--primary-dota); border-radius: 50%;
            pointer-events: none; z-index: 10000; transform: translate(-50%, -50%);
            box-shadow: 0 0 10px var(--primary-dota), 0 0 20px var(--primary-dota);
        }
        #cursor-follower {
            position: fixed; width: 24px; height: 24px; border: 2px solid var(--accent-gold); border-radius: 50%;
            pointer-events: none; z-index: 9999; transform: translate(-50%, -50%);
            transition: transform 0.08s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .click-ripple {
            position: fixed; border: 2px solid var(--primary-dota); border-radius: 50%; pointer-events: none;
            z-index: 9998; transform: translate(-50%, -50%); animation: rippleEffect 0.6s ease-out forwards;
        }
        @keyframes rippleEffect {
            0% { width: 0; height: 0; opacity: 1; }
            100% { width: 150px; height: 150px; opacity: 0; border-color: var(--accent-gold); }
        }
        h1, h2, h3, .tier-badge { font-family: 'Orbitron', sans-serif; letter-spacing: 1px; }
        header { background: linear-gradient(180deg, rgba(17, 22, 29, 0.95) 0%, rgba(8, 11, 14, 0.9) 100%); border-bottom: 2px solid rgba(255, 30, 39, 0.2); padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); }
        .logo-text h1 { font-size: 1.6rem; font-weight: 900; background: linear-gradient(90deg, var(--text-white), var(--accent-gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .logo-text span { font-size: 0.8rem; color: var(--primary-dota); text-transform: uppercase; letter-spacing: 2px; display: block; font-weight: 700; }
        nav { display: flex; gap: 15px; }
        .nav-btn { background: transparent; border: 1px solid rgba(255,255,255,0.1); color: var(--text-gray); padding: 10px 24px; font-size: 0.95rem; font-weight: 600; text-transform: uppercase; border-radius: 4px; transition: all 0.3s; font-family: 'Orbitron', sans-serif; }
        .nav-btn:hover { color: var(--text-white); border-color: var(--accent-gold); background-color: rgba(255, 176, 32, 0.05); }
        .nav-btn.active { color: var(--text-white); background: var(--primary-dota); border-color: var(--primary-dota); box-shadow: var(--glow-shadow); }
        main { max-width: 1400px; margin: 40px auto; padding: 0 20px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .search-container { margin-bottom: 30px; display: flex; justify-content: center; }
        .search-input { width: 100%; max-width: 500px; padding: 12px 20px; background: var(--bg-card); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; color: white; font-family: 'Rajdhani', sans-serif; font-size: 1.1rem; }
        .tier-section { margin-bottom: 50px; }
        .tier-header { display: flex; align-items: center; gap: 15px; margin-bottom: 25px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 10px; }
        .tier-badge { font-size: 1.8rem; font-weight: 900; padding: 5px 20px; border-radius: 4px; }
        .tier-badge.s { background: var(--tier-s); }
        .tier-badge.a { background: var(--tier-a); }
        .tier-badge.b { background: var(--tier-b); }
        .tier-title { font-size: 1.2rem; color: var(--text-gray); text-transform: uppercase; }
        .heroes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 25px; }
        .hero-card { background-color: var(--bg-card); border: 1px solid rgba(255,255,255,0.05); border-radius: 8px; overflow: hidden; padding: 15px; transition: all 0.3s; }
        .hero-card:hover { border-color: var(--accent-gold); background-color: var(--bg-card-hover); transform: translateY(-5px); }
        .hero-name { font-size: 1.4rem; font-weight: 700; margin-bottom: 10px; }
        .hero-stats-row { display: flex; justify-content: space-between; font-size: 0.95rem; }
        .stat-value.win { color: #05c46b; }
        .select-hero-prompt { text-align: center; padding: 60px; background: var(--bg-card); border: 1px dashed rgba(255,255,255,0.1); border-radius: 8px; color: var(--text-gray); }
        .hero-detail-layout { display: grid; grid-template-columns: 320px 1fr; gap: 30px; }
        .active-hero-sidebar { background: var(--bg-card); border: 1px solid rgba(255,255,255,0.05); border-radius: 8px; padding: 20px; text-align: center; }
        .sidebar-name { font-size: 1.6rem; font-weight: 700; margin-bottom: 5px; }
        .detail-panel { background: var(--bg-card); padding: 30px; border-radius: 8px; }
        .panel-title { font-size: 1.4rem; margin-bottom: 25px; border-left: 4px solid var(--primary-dota); padding-left: 12px; }
        .counter-grid-split { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        .counter-box { padding: 20px; border-radius: 6px; background: rgba(0,0,0,0.2); }
        .counter-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body>
    <div id="custom-cursor"></div>
    <div id="cursor-follower"></div>

    <header>
        <div class="logo-container">
            <div class="logo-text">
                <h1>META TRACKER</h1>
                <span>Патч 7.41d Аналитика</span>
            </div>
        </div>
        <nav>
            <button class="nav-btn active" onclick="switchTab('meta')">Мета-Рейтинг</button>
            <button class="nav-btn" onclick="switchTab('builds')">Сборки</button>
            <button class="nav-btn" onclick="switchTab('counters')">Контрпики</button>
        </nav>
    </header>

    <main>
        <section id="meta-tab" class="tab-content active">
            <div class="search-container">
                <input type="text" id="hero-search" class="search-input" placeholder="Поиск героя по имени..." oninput="filterHeroes()">
            </div>
            <div class="tier-section"><div class="tier-header"><span class="tier-badge s">S</span><span class="tier-title">Лидеры (>53% WR)</span></div><div class="heroes-grid" id="tier-s-grid"></div></div>
            <div class="tier-section"><div class="tier-header"><span class="tier-badge a">A</span><span class="tier-title">Сильные (50-53% WR)</span></div><div class="heroes-grid" id="tier-a-grid"></div></div>
            <div class="tier-section"><div class="tier-header"><span class="tier-badge b">B</span><span class="tier-title">Ситуативные (<50% WR)</span></div><div class="heroes-grid" id="tier-b-grid"></div></div>
        </section>

        <section id="builds-tab" class="tab-content">
            <div id="builds-placeholder" class="select-hero-prompt">Выберите героя во вкладке Мета</div>
            <div id="builds-container" class="hero-detail-layout" style="display:none">
                <div class="active-hero-sidebar" id="builds-sidebar"></div>
                <div class="detail-panel"><h2 class="panel-title">Рекомендуемая сборка</h2><div id="items-core" style="padding:15px;background:rgba(0,0,0,0.2);border-radius:6px;color:#ffb020;font-weight:bold">Tango, Power Treads, Manta Style, Black King Bar, Butterfly</div></div>
            </div>
        </section>

        <section id="counters-tab" class="tab-content">
            <div id="counters-placeholder" class="select-hero-prompt">Выберите героя во вкладке Мета</div>
            <div id="counters-container" class="hero-detail-layout" style="display:none">
                <div class="active-hero-sidebar" id="counters-sidebar"></div>
                <div class="detail-panel"><div class="counter-grid-split"><div class="counter-box"><h3>💥 Силен против</h3><div id="counters-best-list"></div></div><div class="counter-box"><h3>⚠️ Слаб против</h3><div id="counters-worst-list"></div></div></div></div>
            </div>
        </section>
    </main>

    <script>
        let state = { heroes: [], selectedHeroId: null };
        const MOCK = [
            { id: 1, name: "Slark", win_rate: 54.2 }, { id: 2, name: "Shadow Fiend", win_rate: 53.8 },
            { id: 3, name: "Pudge", win_rate: 50.8 }, { id: 4, name: "Rubick", win_rate: 47.5 },
            { id: 5, name: "Invoker", win_rate: 51.5 }, { id: 6, name: "Anti-Mage", win_rate: 46.9 }
        ];

        // Логика кастомной мыши
        const cursor = document.getElementById('custom-cursor');
        const follower = document.getElementById('cursor-follower');
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px'; cursor.style.top = e.clientY + 'px';
            setTimeout(() => { follower.style.left = e.clientX + 'px'; follower.style.top = e.clientY + 'px'; }, 40);
        });
        document.addEventListener('click', (e) => {
Используйте код с осторожностью.const r = document.createElement('div'); r.className = 'click-ripple'; r.style.left = e.clientX + 'px'; r.style.top = e.clientY + 'px';document.body.appendChild(r); setTimeout(() => r.remove(), 600);});function switchTab(tab) {document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));const t = window.event; if(t && t.target.classList.contains("nav-btn")) t.target.classList.add('active');document.getElementById(${tab}-tab).classList.add('active');if(state.selectedHeroId) renderHeroDetails(state.selectedHeroId);}function filterHeroes() {const q = document.getElementById('hero-search').value.toLowerCase();renderMetaRating(state.heroes.filter(h => h.name.toLowerCase().includes(q)));}async function fetchDotaData() {try {const e = await fetch("opendota.com"); if(!e.ok) throw new Error;const t = await e.json();state.heroes = t.slice(0, 20).map(x => ({ id: x.id, name: x.localized_name, win_rate: parseFloat(((x.pro_win/(x.pro_win+x.pro_pick))*100).toFixed(1))||50 }));} catch(e) { state.heroes = MOCK; }finally { state.heroes.sort((a,b) => b.win_rate - a.win_rate); renderMetaRating(); }}function renderMetaRating(list = state.heroes) {const grids = { S: document.getElementById("tier-s-grid"), A: document.getElementById("tier-a-grid"), B: document.getElementById("tier-b-grid") };Object.values(grids).forEach(g => { if(g) g.innerHTML = ""; });list.forEach(h => {let n = "B"; if(h.win_rate >= 53) n = "S"; else if(h.win_rate >= 50) n = "A";const card = document.createElement("div"); card.className = "hero-card"; card.onclick = () => selectHero(h.id);card.innerHTML = <div class="hero-name">${h.name}</div><div class="hero-stats-row"><span class="stat-label">Винрейт</span><span class="stat-value win">${h.win_rate}%</span></div>;if (grids[n]) grids[n].appendChild(card);});}function selectHero(id) { state.selectedHeroId = id; switchTab("builds"); }function renderHeroDetails(id) {const t = state.heroes.find(x => x.id === id); if(!t) return;let n = "B"; if(t.win_rate >= 53) n = "S"; else if(t.win_rate >= 50) n = "A";["builds","counters"].forEach(e => {document.getElementById(${e}-placeholder).style.display = "none"; document.getElementById(${e}-container).style.display = "grid";document.getElementById(${e}-sidebar).innerHTML = <div class="sidebar-name">${t.name}</div><div class="sidebar-tier tier-badge">${n}-Тир</div>});const s = state.heroes.filter(x => x.id !== id).slice(0, 2);document.getElementById("counters-best-list").innerHTML = s.map(x => <div class="counter-item"><span>${x.name}</span><span>${(t.win_rate+3).toFixed(1)}%</span></div>).join("");document.getElementById("counters-worst-list").innerHTML = s.map(x => <div class="counter-item"><span>${x.name}</span><span>${(t.win_rate-4).toFixed(1)}%</span></div>).join("");}window.addEventListener("DOMContentLoaded", fetchDotaData);
