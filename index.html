<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Case Opener</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <!-- Подключаем официальный скрипт Telegram Web Apps -->
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --bg-dark: #06080b; --bg-card: rgba(17, 22, 29, 0.7);
            --primary: #ff1e27; --accent: #ffb020;
            --rarity-rare: #00e676; --rarity-mythical: #00b0ff; --rarity-immortal: #e040fb; --rarity-arcana: #ffb020;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            font-family: 'Rajdhani', sans-serif; background-color: var(--bg-dark); color: #fff;
            overflow-x: hidden; min-height: 100vh; padding: 15px;
            background-image: radial-gradient(circle at 50% 20%, rgba(255, 30, 39, 0.15) 0%, transparent 60%);
        }
        h1, h2, h3, .btn, .stat-val { font-family: 'Orbitron', sans-serif; }
        
        /* ШАПКА ПРОФИЛЯ */
        .profile-card { background: var(--bg-card); border: 1px solid rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; backdrop-filter: blur(10px); }
        .user-info h2 { font-size: 1.1rem; color: #fff; }
        .user-info id { font-size: 0.8rem; color: #94a3b8; }
        .balance-box { text-align: right; }
        .balance-box span { font-size: 0.8rem; color: var(--accent); text-transform: uppercase; font-weight: 700; }
        .balance-box div { font-size: 1.4rem; font-weight: 900; color: #fff; text-shadow: 0 0 10px rgba(255,176,32,0.4); }

        /* ИГРОВАЯ ЗОНА: КЕЙС */
        .case-zone { background: var(--bg-card); border: 1px solid rgba(255,30,39,0.2); border-radius: 12px; padding: 30px 15px; text-align: center; margin-bottom: 20px; position: relative; overflow: hidden; box-shadow: 0 0 20px rgba(255,30,39,0.1); }
        .case-title { font-size: 1.2rem; color: var(--primary); margin-bottom: 15px; text-transform: uppercase; }
        
        /* Рулетка открытия */
        .roulette-container { width: 100%; height: 95px; background: rgba(0,0,0,0.4); border-radius: 8px; margin-bottom: 20px; position: relative; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); }
        .pointer { position: absolute; top: 0; left: 50%; width: 2px; height: 100%; background: var(--accent); z-index: 10; box-shadow: 0 0 10px var(--accent); transform: translateX(-50%); }
        .roulette-track { display: flex; position: absolute; left: 0; top: 10px; transition: transform 4s cubic-bezier(0.1, 1, 0.1, 1); will-change: transform; }
        .roulette-item { width: 90px; height: 75px; margin: 0 5px; background: rgba(255,255,255,0.03); border-radius: 6px; display: flex; flex-direction: column; justify-content: center; align-items: center; border-bottom: 4px solid #fff; flex-shrink: 0; }
        .roulette-item.rare { border-color: var(--rarity-rare); background: rgba(0, 230, 118, 0.05); }
        .roulette-item.mythical { border-color: var(--rarity-mythical); background: rgba(0, 176, 255, 0.05); }
        .roulette-item.immortal { border-color: var(--rarity-immortal); background: rgba(224, 64, 251, 0.05); }
        .roulette-item.arcana { border-color: var(--rarity-arcana); background: rgba(255, 176, 32, 0.05); }
        .item-icon { font-size: 1.6rem; }
        .item-lbl { font-size: 0.65rem; font-weight: 700; margin-top: 4px; text-transform: uppercase; max-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .btn { background: var(--primary); border: none; color: #fff; padding: 12px 35px; font-size: 1rem; font-weight: 700; border-radius: 6px; text-transform: uppercase; box-shadow: 0 0 15px rgba(255,30,39,0.4); }
        .btn:disabled { background: #1e293b; color: #64748b; box-shadow: none; }

        /* ИНВЕНТАРЬ */
        .inventory-section h3 { font-size: 1.1rem; margin-bottom: 12px; color: var(--text-gray); text-transform: uppercase; }
        .inventory-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .inv-slot { background: var(--bg-card); border: 1px solid rgba(255,255,255,0.03); aspect-ratio: 1; border-radius: 8px; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; border-bottom: 3px solid #475569; }
        .inv-slot .icon { font-size: 1.5rem; }
        .inv-slot .rarity-dot { position: absolute; top: 6px; right: 6px; width: 6px; height: 6px; border-radius: 50%; }
        .inv-slot.rare { border-bottom-color: var(--rarity-rare); }.inv-slot.rare .rarity-dot { background: var(--rarity-rare); }
        .inv-slot.mythical { border-bottom-color: var(--rarity-mythical); }.inv-slot.mythical .rarity-dot { background: var(--rarity-mythical); }
        .inv-slot.immortal { border-bottom-color: var(--rarity-immortal); }.inv-slot.immortal .rarity-dot { background: var(--rarity-immortal); }
        .inv-slot.arcana { border-bottom-color: var(--rarity-arcana); }.inv-slot.arcana .rarity-dot { background: var(--rarity-arcana); }
    </style>
</head>
<body>
    <div class="profile-card">
        <div class="user-info"><h2 id="username">Cyber_Player</h2><id id="userid">ID: --------</id></div>
        <div class="balance-box"><span>Кредиты</span><div id="balance">1000</div></div>
    </div>

    <div class="case-zone">
        <div class="case-title">Cyberpunk Weapon Case</div>
        <div class="roulette-container">
            <div class="pointer"></div>
            <div class="roulette-track" id="track"></div>
        </div>
        <button class="btn" id="open-btn" onclick="openCase()">Открыть (-100)</button>
    </div>

    <div class="inventory-section">
        <h3>Ваш инвентарь (<span id="inv-count">0</span>)</h3>
        <div class="inventory-grid" id="inv-grid"></div>
    </div>

    <script>
        // Инициализируем Telegram WebApp API
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand(); // Разворачиваем на весь экран телефона
            document.getElementById('username').innerText = tg.initDataUnsafe?.user?.first_name || "Cyber_Player";
            document.getElementById('userid').innerText = "ID: " + (tg.initDataUnsafe?.user?.id || "00000000");
        }

        let state = { balance: 1000, inventory: [] };
        const LOOT_POOL = [
            { name: "Neon Blade", type: "rare", icon: "⚔️" },
            { name: "Laser Rifle", type: "mythical", icon: "🔫" },
            { name: "Cyber Armor", type: "immortal", icon: "🛡️" },
            { name: "Arcana Crown", type: "arcana", icon: "👑" }
        ];

        const track = document.getElementById('track');
        const openBtn = document.getElementById('open-btn');

        // Генерируем ленту рулетки перед стартом
        function generateTrackItems() {
            track.innerHTML = '';
            for(let i=0; i<45; i++) {
                const rand = Math.random();
                let item = LOOT_POOL[0]; // rare по умолчанию
                if(rand > 0.95) item = LOOT_POOL[3];      // arcana (5%)
                else if(rand > 0.85) item = LOOT_POOL[2]; // immortal (10%)
                else if(rand > 0.60) item = LOOT_POOL[1]; // mythical (25%)
                
                const div = document.createElement('div');
                div.className = `roulette-item ${item.type}`;
                div.innerHTML = `<span class="item-icon">${item.icon}</span><span class="item-lbl">${item.name}</span>`;
                track.appendChild(div);
            }
        }
        generateTrackItems();

        function openCase() {
            if(state.balance < 100) { tg?.showAlert("Недостаточно кредитов!"); return; }
            
            state.balance -= 100;
            document.getElementById('balance').innerText = state.balance;
            openBtn.disabled = true;

            generateTrackItems();
            track.style.transition = 'none';
            track.style.transform = 'translateX(0px)';
            
            // Форсируем перерисовку браузера
            track.offsetHeight;

            // Выбираем финальный выигрышный предмет (который встанет под указатель)
            const winIndex = 38; 
            const winItem = track.children[winIndex];
            
            // Рассчитываем точную позицию сдвига ленты
            const itemWidth = 100; 
            const containerWidth = document.querySelector('.roulette-container').offsetWidth;
            const targetX = -(winIndex * itemWidth) + (containerWidth / 2) - (itemWidth / 2);

            track.style.transition = 'transform 4s cubic-bezier(0.1, 1, 0.1, 1)';
            track.style.transform = `translateX(${targetX}px)`;

            setTimeout(() => {
                openBtn.disabled = false;
                
                // Извлекаем данные выигранного предмета из классов и текста элемента
                let type = 'rare';
                if(winItem.classList.contains('arcana')) type = 'arcana';
                else if(winItem.classList.contains('immortal')) type = 'immortal';
                else if(winItem.classList.contains('mythical')) type = 'mythical';
                
                const newItem = {
                    name: winItem.querySelector('.item-lbl').innerText,
                    icon: winItem.querySelector('.item-icon').innerText,
                    type: type
                };

                state.inventory.push(newItem);
                updateInventoryUI();

                // Отправляем данные обратно боту в чат Telegram!
                if(tg) {
                    tg.sendData(JSON.stringify({ event: "case_opened", item: newItem.name, balance: state.balance }));
